# Forgejo: Linux — deb, rpm, Arch pkg + Flatpak (parallel jobs, each publishes to the same release).
# Runner: ubuntu-latest on ci-runner-linux-01..03 (16 GiB each). Flatpak builds on the runner.

name: Release (Linux)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CC: clang-21
      CXX: clang++-21
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-21
      CARGO_BUILD_JOBS: "2"
      NODE_OPTIONS: --dns-result-order=ipv4first
      CARGO_TERM_COLOR: always
      TEAMS_GOOGLE_CLIENT_ID: ${{ secrets.TEAMS_GOOGLE_CLIENT_ID }}
      TEAMS_GOOGLE_CLIENT_SECRET: ${{ secrets.TEAMS_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.forgejo/actions/setup-linux

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            dpkg-dev fakeroot rpm \
            elfutils jq

      - uses: ./.forgejo/actions/setup-rust

      - name: Require Google client on v* tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_GOOGLE_CLIENT_ID:-}" ]; then
            echo "TEAMS_GOOGLE_CLIENT_ID secret is required for v* release builds." >&2
            exit 1
          fi

      - name: Build
        run: cargo build -p app --release -j2

      - name: Package deb rpm arch
        env:
          BINARY_PATH: ${{ github.workspace }}/target/release/teams
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            ver="0.0.0-dev"
          fi
          export RELEASE_VERSION="$ver"
          mkdir -p dist
          packaging/debian/build_deb.sh
          packaging/fedora/build_rpm.sh
          packaging/archlinux/build_pkg.sh
          ls -la dist/

      - name: Publish Forgejo + GitHub mirror
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
          GITHUB_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITHUB_MIRROR_REPO: d0dg3r/rusty-teams
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            export RELEASE_TAG="$GITHUB_REF_NAME"
          else
            export RELEASE_TAG="${RELEASE_TAG_OVERRIDE:-v0.3.0-joe.1}"
          fi
          export RELEASE_NAME="$RELEASE_TAG"
          export RELEASE_PRERELEASE=true
          shopt -s nullglob
          files=(dist/*.deb dist/*.rpm dist/*.pkg.tar.zst)
          export RELEASE_FILES="${files[*]}"
          scripts/ci_forgejo_publish_release.sh

  flatpak:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      TEAMS_GOOGLE_CLIENT_ID: ${{ secrets.TEAMS_GOOGLE_CLIENT_ID }}
      TEAMS_GOOGLE_CLIENT_SECRET: ${{ secrets.TEAMS_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            flatpak flatpak-builder appstream desktop-file-utils \
            elfutils \
            python3 python3-pip python3-venv \
            curl ca-certificates jq
          # Jammy apt tomlkit is too old for flatpak-cargo-generator (.unwrap).
          python3 -m pip install --user -q \
            'aiohttp>=3.9.5,<4' 'tomlkit>=0.13.3,<1' 'PyYAML>=6.0.2,<7'
          # When flatpak-builder-lint is available it must pass (build_flatpak.sh).
          sudo apt-get install --no-install-recommends -y flatpak-builder-lint || true
          command -v eu-strip >/dev/null

      - name: Require Google client on v* tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ -z "${TEAMS_GOOGLE_CLIENT_ID:-}" ]; then
            echo "TEAMS_GOOGLE_CLIENT_ID secret is required for v* Flatpak builds." >&2
            exit 1
          fi

      - name: Build Flatpak on runner
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            ver="0.0.0-dev"
          fi
          export RELEASE_VERSION="$ver"
          # SDK build via packaging/flatpak/build_flatpak.sh (Flathub runtime/SDK on the runner).
          packaging/flatpak/build_flatpak.sh
          ls -la dist/*.flatpak

      - name: Publish Flatpak to Forgejo + GitHub mirror
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
          GITHUB_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITHUB_MIRROR_REPO: d0dg3r/rusty-teams
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            export RELEASE_TAG="$GITHUB_REF_NAME"
          else
            export RELEASE_TAG="${RELEASE_TAG_OVERRIDE:-v0.3.0-joe.1}"
          fi
          export RELEASE_NAME="$RELEASE_TAG"
          export RELEASE_PRERELEASE=true
          shopt -s nullglob
          files=(dist/*.flatpak)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "Flatpak bundle missing — refusing to publish" >&2
            exit 1
          fi
          export RELEASE_FILES="${files[*]}"
          scripts/ci_forgejo_publish_release.sh
